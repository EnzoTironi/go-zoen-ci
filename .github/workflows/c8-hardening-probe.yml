# Temporary probe for the current C8 hardening head.
name: c8-hardening-probe

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: c8-hardening-probe
  cancel-in-progress: true

jobs:
  check-full:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: EnzoTironi/go-zoen
          ref: feat/compiler-c8-cli-hf-bundle
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Report pending source status
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          SHA="$(git rev-parse HEAD)"
          gh api --method POST "repos/EnzoTironi/go-zoen/statuses/${SHA}" \
            -f state=pending \
            -f context=c8-hardening/public \
            -f description="C8 hardening checks running" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: make check-full
        id: check
        continue-on-error: true
        run: make check-full

      - name: Report source status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          STATE=success
          DESCRIPTION="C8 hardening checks passed"
          if [[ "$OUTCOME" != "success" ]]; then
            STATE=failure
            DESCRIPTION="C8 hardening checks failed"
          fi
          gh api --method POST "repos/EnzoTironi/go-zoen/statuses/${SHA}" \
            -f state="$STATE" \
            -f context=c8-hardening/public \
            -f description="$DESCRIPTION" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          [[ "$STATE" == "success" ]]
